apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp234-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mp234-api
  template:
    metadata:
      labels:
        app: mp234-api
    spec:
      containers:
        - name: mp234-api
          image: mp234-api:1.0
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
